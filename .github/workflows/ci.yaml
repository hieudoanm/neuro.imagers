name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-quality:
    name: CLI - Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      # src-tauri is a workspace member, so workspace-wide cargo commands
      # compile the Tauri backend and need its system libraries on Linux.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev rpm

      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  cli-build:
    name: CLI - Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-quality` job.
    if: github.event_name != 'pull_request'
    needs: cli-quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      # neuro-cli only depends on the library crates — no webkit/gtk system
      # libraries are needed, unlike the workspace-wide check job.
      - name: Build neuro CLI
        run: cargo build --release -p neuro-cli

      - name: Rename binary for release
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) mv target/release/neuro cli-neuro-x86_64-unknown-linux-gnu ;;
            macos-latest) mv target/release/neuro cli-neuro-aarch64-apple-darwin ;;
            macos-15-intel) mv target/release/neuro cli-neuro-x86_64-apple-darwin ;;
            windows-latest) mv target/release/neuro.exe cli-neuro-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-neuro-${{ matrix.os }}
          path: cli-neuro-*
          if-no-files-found: error
          retention-days: 7

  desktop-check:
    name: Desktop check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install landing dependencies
        working-directory: packages/landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck landing
        working-directory: packages/landing
        run: pnpm run typecheck

      - name: Lint landing
        working-directory: packages/landing
        run: pnpm run lint

      - name: Build landing (Next.js static export)
        working-directory: packages/landing
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    needs:
      - desktop-check
    # Release bundles are only needed for the master-branch release job;
    # PRs are covered by the `desktop-check` job.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev rpm

      - name: Install dependencies
        working-directory: packages/desktop
        run: pnpm install --frozen-lockfile

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles dmg

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        working-directory: target/release/bundle
        run: |
          set -e
          dmg="$(ls dmg/*.dmg | head -n1)"
          mnt="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          app="$(find "$mnt" -maxdepth 2 -name '*.app' | head -n1)"
          test -n "$app"
          mkdir -p macos
          ditto -c -k --keepParent "$app" "macos/Neuro Imagers.app.zip"
          hdiutil detach "$mnt" >/dev/null

      # Both Mac legs produce identically named bundles; rename per-arch
      # before the artifacts merge in the release job.
      - name: Rename macOS bundles for release
        if: runner.os == 'macOS'
        working-directory: target/release/bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            triple=aarch64-apple-darwin
          else
            triple=x86_64-apple-darwin
          fi
          shopt -s nullglob
          for f in dmg/*.dmg; do mv "$f" "dmg/desktop-neuro-${triple}.dmg"; done
          for f in macos/*.app.zip; do mv "$f" "macos/desktop-neuro-${triple}.app.zip"; done

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles deb,rpm,appimage

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles msi,nsis

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: neuro-imagers-desktop-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: neuro-imagers-desktop-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: neuro-imagers-desktop-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs:
      - desktop-build
      - cli-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download desktop bundles
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: neuro-imagers-desktop-*
          merge-multiple: true
          path: dist

      - name: Download CLI binaries
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-neuro-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: |
          test -d dist
          find dist -type f | sort

      # Tauri bundles keep their build-time names (Neuro.Imagers_0.1.0_...);
      # normalize everything to desktop-neuro-<target>.<ext>. Glob by
      # extension, never by product name. macOS bundles are already renamed
      # per-arch at build time because both Mac legs emit identically named
      # files.
      - name: Normalize release asset names
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob globstar
          for f in **/*.deb; do mv "$f" desktop-neuro-x86_64-unknown-linux-gnu.deb; done
          for f in **/*.rpm; do mv "$f" desktop-neuro-x86_64-unknown-linux-gnu.rpm; done
          for f in **/*.AppImage; do mv "$f" desktop-neuro-x86_64-unknown-linux-gnu.AppImage; done
          for f in **/*.msi; do mv "$f" desktop-neuro-x86_64-pc-windows-msvc.msi; done
          for f in **/*-setup.exe; do mv "$f" desktop-neuro-x86_64-pc-windows-msvc-setup.exe; done
          ls -1

      - name: Delete existing latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/latest || true

      - name: Create rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "Neuro Imagers (latest)" \
            --notes-file RELEASE.md \
            --prerelease=false

      - name: Upload bundles to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find dist -type f \( -name 'desktop-neuro-*' \) -exec gh release upload latest {} --clobber \;

      - name: Upload CLI binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find dist -type f -name 'cli-neuro-*' -exec gh release upload latest {} --clobber \;
